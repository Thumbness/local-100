<!DOCTYPE html>
<html>
<head>
    <title>Video Player</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <div class="player-wrap">
        <header class="now-header">
            <div class="now-info">
                <div class="now-title" id="now-title"></div>
                <div class="now-artist" id="now-artist"></div>
            </div>
            <div class="nav-btns">
                <button id="prev-btn" class="next-btn" type="button">&#9664; Previous</button>
                <button id="next-btn" class="next-btn" type="button">Next &#9654;</button>
                <button id="the-bouys-btn" class="next-btn" type="button">The Bouys</button>
            </div>
        </header>
        <div class="video-area">
            <video id="player" controls></video>
            <div id="overlay" class="overlay" hidden>
                <div class="overlay-text" id="overlay-text"></div>
                <button id="start-btn" class="start-btn" type="button" hidden>Start countdown &#9654;</button>
            </div>
        </div>
    </div>
    <ul class="playlist" id="playlist"></ul>
</div>

<script>
    const entries = {{ entries | tojson }};
    const imageUrls = {{ image_urls | tojson }};
    const COUNTDOWN_SECONDS = 10;

    const player = document.getElementById('player');
    const playlist = document.getElementById('playlist');
    const nextBtn = document.getElementById('next-btn');
    const prevBtn = document.getElementById('prev-btn');
    const theBouysBtn = document.getElementById('the-bouys-btn');
    const overlay = document.getElementById('overlay');
    const overlayText = document.getElementById('overlay-text');
    const startBtn = document.getElementById('start-btn');
    const nowTitle = document.getElementById('now-title');
    const nowArtist = document.getElementById('now-artist');

    let current = -1;         
    let revealed = -1;        
    let countdownTimer = null;
    let bouysTimer = null;

    function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
    }

    function buildCard(entry, isActive) {
        const li = el('li', isActive ? 'active' : '');
        li.appendChild(el('div', 'song-title', entry.title));
        li.appendChild(el('div', 'song-artist', entry.artist));
        entry.voters.forEach(v => {
            const row = el('div', 'row');
            row.appendChild(el('span', '', v.name));
            row.appendChild(el('span', '', v.position));
            li.appendChild(row);
        });
        const rankRow = el('div', 'row rank-row');
        rankRow.appendChild(el('span', '', entry.rank));
        rankRow.appendChild(el('span', '', `${entry.points} points`));
        li.appendChild(rankRow);
        return li;
    }

    function renderPlaylist() {
        playlist.replaceChildren();
        for (let i = revealed; i >= 0; i--) {
            playlist.appendChild(buildCard(entries[i], i === current));
        }
    }

    function updateNextButton() {
        nextBtn.hidden = current >= entries.length - 1;
    }

    function updatePrevButton() {
        prevBtn.hidden = current <= 0;
    }

    function hideOverlay() {
        clearInterval(countdownTimer);
        countdownTimer = null;
        overlay.hidden = true;
    }

    function play(index) {
        hideOverlay();
        startBtn.hidden = true;
        current = index;
        revealed = Math.max(revealed, index);
        player.src = `/video/${entries[index].filename}`;
        player.play();
        renderPlaylist();
        updateNextButton();
        updateHeader(entries[index]);
    }

    function updateHeader(entry) {
        nowTitle.textContent = entry.title;
        nowArtist.textContent = entry.artist;
    }

    function playNext() {
        if (current < entries.length - 1) play(current + 1);
    }

    function startCountdown() {
        if (current >= entries.length - 1) {
            overlayText.textContent = 'Countdown complete';
            overlay.hidden = false;
            return;
        }
        let remaining = COUNTDOWN_SECONDS;
        const tick = () => {
            overlayText.textContent = `Next song in ${remaining}`;
            remaining--;
            if (remaining < 0) playNext();
        };
        overlay.hidden = false;
        tick();
        countdownTimer = setInterval(tick, 1000);
    }

    function playPrev() {
        if (current > 0) play(current - 1);
    }
    function showRandomImage() {
        if (!imageUrls.length) return;

        const randomImage = imageUrls[Math.floor(Math.random() * imageUrls.length)];
        const img = document.createElement('img');
        img.src = randomImage;
        img.className = 'floating-image';
        img.alt = '';
        img.style.animation = 'none';
        img.addEventListener('animationend', () => img.remove(), { once: true });
        img.addEventListener('error', () => img.remove(), { once: true });
        img.addEventListener('load', () => {
            const { width, height } = img.getBoundingClientRect();
            const horizontal = Math.random() < 0.5;
            const forward = Math.random() < 0.5;
            let startX;
            let startY;
            let endX;
            let endY;

            if (horizontal) {
                startX = forward ? -width : window.innerWidth;
                endX = forward ? window.innerWidth : -width;
                startY = Math.random() * Math.max(0, window.innerHeight - height);
                endY = Math.random() * Math.max(0, window.innerHeight - height);
            } else {
                startY = forward ? -height : window.innerHeight;
                endY = forward ? window.innerHeight : -height;
                startX = Math.random() * Math.max(0, window.innerWidth - width);
                endX = Math.random() * Math.max(0, window.innerWidth - width);
            }

            img.style.left = `${startX}px`;
            img.style.top = `${startY}px`;
            img.style.setProperty('--travel-x', `${endX - startX}px`);
            img.style.setProperty('--travel-y', `${endY - startY}px`);
            requestAnimationFrame(() => { img.style.animation = ''; });
        }, { once: true });
        document.body.appendChild(img);
        img.src = randomImage;
    }

    function theBouys() {
        showRandomImage();
    }

    nextBtn.addEventListener('click', playNext);
    prevBtn.addEventListener('click', playPrev);
    player.addEventListener('ended', startCountdown);
    startBtn.addEventListener('click', () => play(0));
    theBouysBtn.addEventListener('click', theBouys);

    if (imageUrls.length) bouysTimer = setInterval(showRandomImage, 60000);

    if (entries.length) {
        nextBtn.hidden = true;
        startBtn.hidden = false;
        overlay.hidden = false;
    }
</script>
</body>
</html>
