<!DOCTYPE html>
<html>
<head>
    <title>Hardest 100</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="landing">
    <h1>Hardest 100</h1>
    {% if error %}
        <p class="notice">{{ error }}</p>
    {% endif %}
    {% if notice %}
        <p class="notice success">{{ notice }}</p>
    {% endif %}
    <div class="landing-buttons">
        <a class="start-btn" href="{{ url_for('library.search') }}">Search Your Library</a>
        {% if current_user and current_user.is_admin %}
        <a class="start-btn" href="{{ url_for('upload.upload_page') }}">Upload Countdown File</a>
        {% endif %}
        <a class="start-btn" href="{{ url_for('countdown') }}">Start Countdown</a>
    </div>
    {% if current_user %}
    <form class="signed-in" method="post" action="{{ url_for('auth.logout') }}">
        <span class="page-subtle">Signed in as {{ current_user.username }}</span>
        <button class="next-btn" type="submit">Sign out</button>
    </form>
    {% endif %}
</div>
</body>
</html>
